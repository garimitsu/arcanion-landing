function setComp(el, o, drift) {
  el.style.opacity = o.toFixed(3);
  el.style.transform = drift ? `translateY(${drift.toFixed(1)}px)` : '';
  el.classList.toggle('is-live', o > 0.5);
}
function driveCompositions() {
  const S = scrollState;
  // Computed once in driveCamera (which runs first) — s2 in particular is on the
  // rail-frozen clock, so recomputing it here would fade the Games copy out while
  // its own rail was still travelling.
  const { s1, s2, s3 } = frame;

  setComp(compHero, 1 - smoothstep(0.04, 0.40, s1), -40 * smoothstep(0.04, 0.40, s1));
  setComp(compServices, smoothstep(0.30, 0.62, s1) * (1 - smoothstep(0.05, 0.38, s2)), 0);
  setComp(compTimeline, smoothstep(0.35, 0.70, s2) * (1 - smoothstep(0.74, 0.98, s3)), 0);
  setComp(compExplore, smoothstep(0.10, 0.45, frame.exploreAmt), 0);

  // the Games rail travels on the Games slide's own local progress
  if (innerWidth >= 856) {
    const gp = smoothstep(0, 1, S.local.sitemap);
    gameRow.style.transform = `translateX(${(-gp * GAME_TRAVEL).toFixed(2)}px)`;
  } else {
    gameRow.style.transform = '';
  }

  // the Models rail travels right-to-left on that slide's own local progress
  const p = smoothstep(0, 1, S.local.roadmap);
  if (innerWidth >= 856) {
    trackEl.style.transform = `translateX(${(-p * TRAVEL).toFixed(2)}px)`;
  } else {
    const over = Math.max(0, trackEl.scrollHeight - (innerHeight - 200));
    trackEl.style.transform = `translateY(${(-p * over).toFixed(2)}px)`;
  }

  // the corridor flies on the Explore slide's local progress — one continuous
  // scroll out of Models, no cross-fade seam
  if (innerWidth >= 856) {
    const flyP = smoothstep(0.12, 1, S.local.impact);
    etTrack.style.setProperty('--flyz', `${(flyP * corridorDepth).toFixed(1)}px`);
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   PRELOADER → HANDOFF
   ════════════════════════════════════════════════════════════════════════════ */
const LOAD_MS = 1800, SURGE_MS = 650;
const plFill = document.getElementById('plFill'), plPct = document.getElementById('plPct');
const preloader = document.getElementById('preloader');
let loadStart = performance.now(), surgeStart = 0, warpDone = false;

/* ════════════════════════════════════════════════════════════════════════════
   FRAME LOOP
   ════════════════════════════════════════════════════════════════════════════ */
const FRAME_MS = TIER === 'mobile' ? 1000 / 30 : TIER === 'tablet' ? 1000 / 45 : 0;
let lastDraw = 0, hidden = false, frozen = false;
document.addEventListener('visibilitychange', () => { hidden = document.hidden; });

function tick(nowMs) {
  requestAnimationFrame(tick);
  if (hidden) return;
  if (FRAME_MS && nowMs - lastDraw < FRAME_MS) return;
  lastDraw = nowMs;

  const t = nowMs / 1000;
  if (lenis) lenis.raf(nowMs);
  updateScrollState();

  warpMat.uniforms.iTime.value = t;

  /* ── preloader ── */
  if (!warpDone) {
    const p = clamp01((nowMs - loadStart) / LOAD_MS);
    plFill.style.transform = `scaleX(${p})`;
    plPct.textContent = String(Math.round(p * 100)).padStart(3, '0');
    warpMat.uniforms.uBoost.value = p;
    if (p >= 1 && !surgeStart) surgeStart = nowMs;
    if (surgeStart) {
      const s = clamp01((nowMs - surgeStart) / SURGE_MS);
      warpMat.uniforms.uSurge.value = s;
      warpMat.uniforms.uOpacity.value = 1 - s;
      preloader.style.opacity = String(1 - s);
      if (s >= 1) {
        warpDone = true;
        warp.visible = false;                 // kept alive for the corridor
        warpMat.uniforms.uSurge.value = 0;
        preloader.remove();
        appearStart = nowMs; sceneArmed = true;
        latch('nav', nowMs); latch('hero', nowMs);
        window.__arcanionSceneReady = true;
      }
    }
  }

  appear = sceneArmed ? 1 - Math.pow(1 - clamp01((nowMs - appearStart) / 1800), 3) : 0;

  if (sceneArmed) {
    const a = scrollState.active;
    if (a === 'sitemap') latch('sitemap', nowMs);
    if (a === 'roadmap') latch('roadmap', nowMs);
    if (a === 'impact')  latch('impact', nowMs);
  }

  if (!frozen) {
    const { t1, t2, exploreAmt } = driveCamera(t);

    morphMat.uniforms.iTime.value = t;
    morphMat.uniforms.uUniTime.value = t + 6;
    morphMat.uniforms.uT1.value = t1;
    morphMat.uniforms.uT2.value = t2;
    morphMat.uniforms.uNeedUni.value   = t1 < 1 ? 1 : 0;
    morphMat.uniforms.uNeedBurst.value = (t1 > 0 && t2 < 1) ? 1 : 0;
    morphMat.uniforms.uNeedMael.value  = t2 > 0 ? 1 : 0;
    morphMat.uniforms.uMaelPhase.value = scrollState.local.roadmap;

    // the cloud dissolves as the corridor takes the frame
    const dissolve = smoothstep(0.15, 0.9, exploreAmt);
    morphMat.uniforms.uAlpha.value = appear * (1 - dissolve);

    for (const key of ['coreStrength','coreSize','coreSharp','haloAmount','haloWidth','haloFalloff']) {
      const U = 'u' + key[0].toUpperCase() + key.slice(1);
      morphMat.uniforms[U].value = blend3(GLOW.uni[key], GLOW.burst[key], GLOW.mael[key], t1, t2);
    }

    const P = POINTER_FORCE, gate = pointer.moved && !isTouch ? 1 : 0;
    morphMat.uniforms.uPointer.value.copy(pointerWorld);
    morphMat.uniforms.uPointerAxis.value.copy(_look);
    morphMat.uniforms.uPointerR.value     = blend3(P.uni.radius, P.burst.radius, P.mael.radius, t1, t2);
    morphMat.uniforms.uPointerPush.value  = blend3(P.uni.push,  P.burst.push,  P.mael.push,  t1, t2) * gate;
    morphMat.uniforms.uPointerSwirl.value = blend3(P.uni.swirl, P.burst.swirl, P.mael.swirl, t1, t2) * gate;
    morphMat.uniforms.uPointerGlow.value  = blend3(P.uni.glow,  P.burst.glow,  P.mael.glow,  t1, t2) * gate;

    starMat.uniforms.iTime.value = t;
    starMat.uniforms.uAlpha.value = Math.min(1, appear * 1.4);
    dustMat.uniforms.iTime.value = t;
    dustMat.uniforms.uAlpha.value = appear;

    // the warp returns as the corridor's tunnel backdrop
    if (warpDone) {
      const tun = smoothstep(0.2, 0.85, exploreAmt);
      warp.visible = tun > 0.01;
      warpMat.uniforms.uBoost.value = 0.35 + 0.45 * tun;
      warpMat.uniforms.uOpacity.value = tun * 0.85;
    }

    if (reducedMotion && appear >= 0.999) frozen = true;
  }

  driveCompositions();
  tickReveals(nowMs);

  finalPass.uniforms.iTime.value = t;
  composer.render();
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
layout();
addEventListener('resize', layout, { passive: true });

if (typeof Lenis === 'function') {
  lenis = new Lenis({ smoothWheel: true });
} else {
  console.warn('[landing] Lenis did not load — falling back to native scrolling.');
}

requestAnimationFrame(tick);
window.__arcanionSceneBooted = true;
</script>

<script>
/* ── Waitlist ────────────────────────────────────────────────────────────────
   Deliberately here and NOT in the module: the module opens with
   `import ... from 'three'` against a CDN, and if that import fails the whole
   module is skipped — listener included. The form would then fall through to a
   native submit. That is survivable ONLY because the markup posts to Google on
   its own; this script is the enhancement, not the mechanism.

   The post goes through /api/waitlist rather than straight to Google, because
   the browser cannot confirm its own signup: Google sends no CORS headers, so a
   direct POST must use `no-cors` and comes back opaque — no status, no body. A
   resolved promise there means the request left the building, never that Google
   stored it. The function reads the real response and answers {ok:true} only
   when Google actually recorded it, so "You're on the list" is never a guess.

   Any failure at all — function missing, network down, Google rejecting —
   silently opens the prefilled form in a new tab. No error text: the visitor
   just lands on the form with their address already filled in, and the reason
   goes to the console. A signup is never dropped and never falsely confirmed. */
(function () {
  var API = '/api/waitlist';
  var FORM_VIEW = 'https://docs.google.com/forms/d/e/1FAIpQLSc8q9HDUV_7dZMTuxq8ii2Z31yh2VSEhtpeeorKcgnn7ATfaw/viewform';
  var EMAIL_ENTRY = 'entry.442508991';

  function prefilledForm(email) {
    var u = new URL(FORM_VIEW);
    u.searchParams.set('usp', 'pp_url');
    u.searchParams.set(EMAIL_ENTRY, email);
    return u.toString();
  }

  // Opened from inside the submit gesture's activation window, so it is a
  // normal popup rather than a blocked one. If a blocker takes it anyway,
  // navigate — reaching the form matters more than staying on the page.
  function openForm(email, why) {
    console.error('[landing] waitlist not confirmed (' + why + ') — opening the form instead.');
    var url = prefilledForm(email);
    var win = window.open(url, '_blank', 'noopener,noreferrer');
    if (!win) window.location.href = url;
  }

  document.querySelectorAll('[data-waitlist-form]').forEach(function (form) {
    var field = form.querySelector('.sb-field');
    var label = form.querySelector('.sb-label');
    var idle  = label ? label.textContent : 'Join the waitlist';
    var done  = false;

    form.addEventListener('submit', function (e) {
      if (done) { e.preventDefault(); return; }
      var email = (field.value || '').trim();
      if (!email || !form.reportValidity()) return;   // let the browser complain
      e.preventDefault();
      if (label) label.textContent = 'Joining\u2026';

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
        .then(function (r) {
          return r.json().catch(function () { return null; }).then(function (data) {
            if (r.ok && data && data.ok === true) {
              done = true;
              field.value = '';
              field.placeholder = 'Welcome Beyond';
              field.disabled = true;
              if (label) label.textContent = "You're on the list";
              return;
            }
            if (label) label.textContent = idle;
            openForm(email, 'HTTP ' + r.status + ((data && data.reason) ? ' ' + data.reason : ''));
          });
        })
        .catch(function (err) {
          if (label) label.textContent = idle;
          openForm(email, String(err && err.message ? err.message : err));
        });
    });
  });
})();

/* Fail-soft guard (island deviation #2): if the module never boots — CDN
   unreachable, WebGL refused, importmap unsupported — the page must not be a
   blank void. Reveal every composition as a plain stacked document and say why,
   loudly. Silence here would disguise a dead CDN as "the landing page is broken". */
window.addEventListener('error', e => {
  if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
    console.error('[landing] asset failed to load:', e.target.src || e.target.href, e);
  }
}, true);
setTimeout(() => {
  if (window.__arcanionSceneReady) return;
  console.error(
    '[landing] the WebGL scene did not become ready within 8s. ' +
    'booted=' + !!window.__arcanionSceneBooted + ' webgl=' +
    !!document.createElement('canvas').getContext('webgl2') +
    ' — falling back to the static composition. Most likely cause: three.js/Lenis ' +
    'could not be fetched from unpkg (offline desktop build?).'
  );
  document.body.classList.add('no-scene');
}, 8000);
</script>

</body>
